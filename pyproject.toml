[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sft-align"
version = "0.1.0"
description = "ELBO-Guided Sequential Trajectory Alignment for LLM Agent SFT (ICML 2027)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "datasets>=2.19.0",
    "accelerate>=0.33.0",
    "peft>=0.12.0",
    "trl>=0.10.0",
]
vllm = [
    "vllm>=0.6.0",
]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
